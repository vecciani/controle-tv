<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle TV</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font-size: 1.35vw; }

  /* Synthwave floor */
  .floor {
    position: fixed; left: -50%; right: -50%; bottom: -10vh; height: 55vh; z-index: 0; opacity: .35; pointer-events: none;
    transform: perspective(40vh) rotateX(62deg); transform-origin: bottom;
    background:
      linear-gradient(rgba(168, 85, 247, .55) 2px, transparent 2px) 0 0 / 100% 6vh,
      linear-gradient(90deg, rgba(34, 211, 238, .45) 2px, transparent 2px) 0 0 / 6vw 100%;
    -webkit-mask-image: linear-gradient(transparent, #000 60%);
    mask-image: linear-gradient(transparent, #000 60%);
  }

  .screen { position: relative; z-index: 1; height: 100%; padding: 4.5vh 4vw 0; display: flex; flex-direction: column; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .clock {
    font-size: 8.5vw; font-weight: 800; line-height: .95; letter-spacing: -.04em;
    text-shadow: 0 0 2vw rgba(34, 211, 238, .45);
  }
  .clock .sep { animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .date { margin-top: .8vh; font-size: 1.7vw; color: var(--muted); }
  .greet { font-size: 1.7vw; margin-top: .3vh; }

  .chips { display: flex; flex-direction: column; align-items: flex-end; gap: 1.2vh; }
  .chip {
    display: flex; align-items: center; gap: .8vw; padding: 1vh 1.3vw; border-radius: 999px; font-size: 1.15vw;
    background: rgba(18, 18, 29, .8); border: 1px solid var(--line); color: var(--muted);
  }
  .chip svg { width: 1.4vw; height: 1.4vw; }
  .chip .dot { width: .7vw; height: .7vw; }

  .rows { margin-top: 4vh; flex: 1; min-height: 0; }
  .row h2 { margin: 0 0 1.4vh; font-size: 1.5vw; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .row + .row { margin-top: 3.5vh; }
  .strip { display: flex; gap: 1.4vw; overflow: hidden; padding: 2vh 1.5vw 1.6vh; margin: 0 -1.5vw; scroll-behavior: smooth; }
  .tile { flex: 0 0 auto; width: 15vw; text-align: left; }
  .tile .art {
    aspect-ratio: 16 / 9; border-radius: 1vw; overflow: hidden; background: var(--surface);
    border: 1px solid var(--line); transition: transform .15s, box-shadow .15s;
  }
  .tile .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .name {
    display: block; margin-top: 1vh; font-size: 1.1vw; color: var(--muted); opacity: 0; transition: opacity .15s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile.focus .art { transform: scale(1.08); box-shadow: 0 0 0 .25vw var(--cyan), 0 0 3vw rgba(34, 211, 238, .55); }
  .tile.focus .name { opacity: 1; color: var(--text); }
  .tile.fav .art { border-color: rgba(168, 85, 247, .35); }

  /* Connect card */
  .connect {
    display: flex; align-items: center; gap: 1.2vw; margin-top: .6vh;
    padding: 1vw 1.2vw; border-radius: 1.4vw; background: rgba(13, 13, 23, .92);
    border: 1px solid rgba(34, 211, 238, .35); box-shadow: 0 0 4vw rgba(34, 211, 238, .15);
  }
  .connect img { width: 6.5vw; height: 6.5vw; border-radius: .5vw; background: #fff; }
  .connect h3 { margin: 0; font-size: 1.2vw; }
  .connect p { margin: .6vh 0 0; color: var(--muted); font-size: 1.05vw; }
  .connect .pin { margin-top: .8vh; font-size: 2vw; font-weight: 800; letter-spacing: .3em; color: var(--cyan); text-shadow: 0 0 1.5vw rgba(34, 211, 238, .6); }

  /* First run: big centered card */
  .connect.big {
    position: fixed; z-index: 2; margin: 0; left: 50%; top: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%);
    flex-direction: column; text-align: center; padding: 3vw 4vw; gap: 1vh;
  }
  .connect.big img { width: 22vw; height: 22vw; margin-bottom: 1vh; }
  .connect.big h3 { font-size: 2.4vw; }
  .connect.big p { font-size: 1.4vw; }
  .connect.big .pin { font-size: 4vw; }
  body.first .rows, body.first .floor { opacity: .15; }

  .toast {
    position: fixed; left: 50%; top: 5vh; transform: translate(-50%, -2vh); opacity: 0; transition: .25s;
    padding: 1.2vh 2vw; border-radius: 999px; font-size: 1.3vw; background: var(--surface-2);
    border: 1px solid rgba(34, 211, 238, .4); box-shadow: var(--glow-cyan);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="floor"></div>

<div class="screen">
  <div class="top">
    <div>
      <div class="clock" id="clock">--<span class="sep">:</span>--</div>
      <div class="date" id="date"></div>
      <div class="greet"><span class="neon-text" id="greet"></span></div>
    </div>
    <div class="chips">
      <div class="chip"><span class="dot" id="phone-dot"></span><i data-icon="phone"></i><span id="phone-text">Nenhum celular</span></div>
      <div class="chip"><span class="dot" id="adb-dot"></span><i data-icon="zap"></i><span id="adb-text">Conectando</span></div>
      <div class="connect" id="connect" hidden>
        <img id="qr" alt="QR code">
        <div>
          <h3 id="connect-title">Conectar celular</h3>
          <p id="connect-url"></p>
          <div class="pin" id="connect-pin"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="rows">
    <div class="row" id="row-favs"><h2>Favoritos</h2><div class="strip" id="favs"></div></div>
    <div class="row"><h2>Todos os apps</h2><div class="strip" id="all"></div></div>
  </div>
</div>


<div class="toast" id="toast"></div>

<script src="icons.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const key = new URLSearchParams(location.hash.slice(1)).get('k') || '';

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', 'X-Token': key },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erro');
  return data;
}
const iconUrl = (pkg) => `/api/icon?pkg=${encodeURIComponent(pkg)}&token=${encodeURIComponent(key)}`;

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ---------- Clock ----------
const capitalize = (text) => text.charAt(0).toUpperCase() + text.slice(1);
function tick() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  $('clock').innerHTML = `${hh}<span class="sep">:</span>${mm}`;
  $('date').textContent = capitalize(now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }));
  const h = now.getHours();
  $('greet').textContent = h < 5 ? 'Boa noite' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}

// ---------- Apps + D-pad focus ----------
let rows = [];      // [[app, ...], [app, ...]]
let focus = { row: 0, col: 0 };

async function loadApps() {
  try {
    const { apps, favorites } = await api('/api/apps');
    const byPkg = Object.fromEntries(apps.map((a) => [a.pkg, a]));
    const favs = favorites.map((p) => byPkg[p]).filter(Boolean);
    $('row-favs').hidden = favs.length === 0;
    rows = [favs, apps].filter((r) => r.length);
    $('favs').replaceChildren(...favs.map((a) => tile(a, true)));
    $('all').replaceChildren(...apps.map((a) => tile(a, favorites.includes(a.pkg))));
    focus.row = Math.min(focus.row, rows.length - 1);
    focus.col = Math.min(focus.col, (rows[focus.row]?.length || 1) - 1);
    paintFocus();
  } catch {}
}

function tile(app, fav) {
  const el = document.createElement('div');
  el.className = 'tile' + (fav ? ' fav' : '');
  el.innerHTML = `<div class="art"><img src="${iconUrl(app.pkg)}" alt=""></div><span class="name"></span>`;
  el.querySelector('.name').textContent = app.label;
  return el;
}

function strips() {
  return [$('favs'), $('all')].filter((s) => s.children.length && !s.closest('[hidden]'));
}

function paintFocus() {
  document.querySelectorAll('.tile.focus').forEach((t) => t.classList.remove('focus'));
  const strip = strips()[focus.row];
  const el = strip?.children[focus.col];
  if (!el) return;
  el.classList.add('focus');
  strip.scrollLeft = el.offsetLeft - strip.clientWidth / 2 + el.clientWidth / 2;
}

document.addEventListener('keydown', async (e) => {
  if (!rows.length) return;
  const moves = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
  if (moves[e.key]) {
    e.preventDefault();
    const [dr, dc] = moves[e.key];
    focus.row = Math.max(0, Math.min(rows.length - 1, focus.row + dr));
    focus.col = Math.max(0, Math.min(rows[focus.row].length - 1, focus.col + dc));
    paintFocus();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const app = rows[focus.row]?.[focus.col];
    if (!app) return;
    toast(`Abrindo ${app.label}`);
    api('/api/launch', { pkg: app.pkg }).catch((err) => toast(err.message));
  }
});

// ---------- Status ----------
const ADB = {
  ok: ['ok', 'Controle total'],
  waiting: ['warn', 'Aceite "Permitir depuração"'],
  off: ['off', 'Ative a Depuração ADB'],
};

async function refreshStatus() {
  try {
    const s = await api('/api/status');
    const [dot, text] = ADB[s.adb] || ADB.off;
    $('adb-dot').className = `dot ${dot}`;
    $('adb-text').textContent = text;
    $('phone-dot').className = `dot ${s.phoneActive ? 'ok' : ''}`;
    $('phone-text').textContent = s.phoneActive ? 'Celular conectado' : s.paired ? 'Celular pareado' : 'Nenhum celular';

    const first = !s.paired;
    document.body.classList.toggle('first', first);
    const card = $('connect');
    card.hidden = !s.url;
    card.classList.toggle('big', first);
    $('connect-title').textContent = first ? 'Aponte a câmera do celular' : 'Conectar outro celular';
    $('connect-url').textContent = s.url || '';
    $('connect-pin').textContent = s.pin;
    const qr = `/api/qr.png?token=${encodeURIComponent(key)}&u=${encodeURIComponent(s.url)}`;
    if ($('qr').dataset.src !== qr) { $('qr').src = qr; $('qr').dataset.src = qr; }
  } catch {}
}

paintIcons();
tick();
setInterval(tick, 1000);
refreshStatus();
setInterval(refreshStatus, 3000);
loadApps();
setInterval(loadApps, 30000);
</script>
</body>
</html>
